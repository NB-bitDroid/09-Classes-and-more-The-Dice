<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./CSS/style.css">
        <script src="/JS/dice.js"></script>
        <title>Dice</title>
    </head>
    <body>
        <div class="container">
            <div class="dice-container">
                <div class="dice"></div>
                <div class="dice"></div>
                <div class="dice"></div>
                <div class="dice"></div>
                <div class="dice"></div>
            </div>
            <div class="controls">
                <button id="rollBtn" onclick="rollDice()" >Roll</button>
            </div>
        </div>
        <script>
            const diceContainers = document.querySelectorAll(".dice"); //should use getElementsByclass?
            let dice = [];
            diceContainers.forEach((di, idx)=>{
                //di is the current html element in the array
                //idx is the index of the array
                dice.push(new Dice(di));
            });

            // function rollDice(){
            //     dice.forEach((d) => {
            //         d.roll();
            //     });
            //     console.log(calcuateDiceTotal());
            // }

            async function rollDice(){
                let rolls = []
                for(let d of dice){
                    rolls.push(d.roll()) // rolls is an array of promises
                }
                // await - requires being run in an async environment 
                await Promise.all(rolls); //stop executiong until all promises are complete
                console.log(calcuateDiceTotal());
            }

            function calcuateDiceTotal() {
                let total = 0;
                dice.forEach((d) => {
                    total += d.value;
                });
                return total;
            }
        </script>
    </body>
</html>
